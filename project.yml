name: SecureVault
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  SecureVault:
    type: application
    platform: iOS
    sources:
      - path: SecureVault
        excludes:
          - Info.plist
    info:
      path: SecureVault/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: Secure Vault
        NSFaceIDUsageDescription: "Используется для защиты ключа шифрования хранилища."
        UILaunchScreen:
          UIImageName: LaunchMark
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.securevault.local
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  SecureVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SecureVaultTests
        optional: true
    dependencies:
      - target: SecureVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.securevault.local.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SecureVault.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SecureVault"
        BUNDLE_LOADER: "$(TEST_HOST)"
