name: Build Secure Vault (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'SecureVault/**'
      - 'SecureVaultTests/**'
      - 'project.yml'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iPhone app (without code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project SecureVault.xcodeproj \
            -scheme SecureVault \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p output/Payload
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/SecureVault.app" output/Payload/
          cd output
          zip -q -r SecureVault-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-unsigned-IPA
          path: output/SecureVault-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
